[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openhotspot"
version = "0.1.0"
description = "Linux client for OpenHotspot: turn on a stock Android phone's hotspot over BLE."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography>=42", "bleak>=3.0,<4"]

[project.optional-dependencies]
keyring = ["keyring>=24"]
tray = ["pystray>=0.19", "Pillow>=10"]
dev = ["pytest>=8", "keyring>=24"]

[project.scripts]
openhotspot = "openhotspot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

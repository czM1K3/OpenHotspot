[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openhotspot"
version = "0.1.0"
description = "Linux client for OpenHotspot: turn on a stock Android phone's hotspot over BLE."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["cryptography>=42", "bleak>=3.0,<4"]

[project.optional-dependencies]
keyring = ["keyring>=24"]
tray = ["pystray>=0.19", "Pillow>=10"]
dev = ["pytest>=8", "keyring>=24"]

[project.scripts]
openhotspot = "openhotspot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S603/S607: argv lists with fixed program names, never a shell. S110: best-effort cleanup paths.
# UP042: str-mixin enums are kept because their str() form is relied on in state files/logs.
ignore = ["S101", "S603", "S607", "S110", "UP042", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E402", "E702", "E731"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
